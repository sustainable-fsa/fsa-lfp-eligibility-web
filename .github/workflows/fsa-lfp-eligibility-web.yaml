# Canonical archive-update workflow (sustainable-fsa S3 migration).
name: update
run-name: Update the fsa-lfp-eligibility-web archive → S3

on:
  schedule:
    # daily, evening US/Mountain; FSA posts new maps Thursdays after the
    # U.S. Drought Monitor release. No-op days fast-exit via the freshness
    # gate before any S3 write.
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: >-
          Regenerate and republish the consolidated outputs (CSV, parquet,
          dashboard, manifest) even when the maps page shows nothing new.
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['**.R', '**.qmd', '.github/workflows/**']

permissions:
  id-token: write
  contents: write  # commit-back of the archive outputs and rendered dashboard

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: fsa-lfp-eligibility-web
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
      FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1
        with:
          # `readxl` reads the harvested workbooks, `digest` hashes new assets
          # for the provenance log, `jsonlite` writes it, and `rmarkdown`
          # re-renders the README.
          extra-r-packages: quarto readxl digest jsonlite rmarkdown

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update archive
        run: Rscript fsa-lfp-eligibility-web.R

      # Commit the archive outputs and the rendered dashboard back to git;
      # GitHub Pages serves the dashboard from this repo. No-op days quit before
      # any of this, so it only fires when the archive actually gained data.
      #
      # `git add -A`, not just the html: the CSV, both parquets, the events
      # files, qa-report.txt, the dashboard extract and manifest.json are all
      # tracked, and adding only the html left every one of them stale in git the
      # moment CI ran.
      - name: Commit refreshed archive
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git commit -m 'Update archive'
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::notice::Archive render superseded by a concurrent run; skipping commit."
            exit 0
          fi
          git push
